<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WinGroove Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="wg-main-window">
  <div class="win" id="mainWin">
    <!-- WinGroove Classic Titlebar -->
    <div class="titlebar draggable-header">
      <div class="title-left">
        <div class="system-menu-icon" id="sysMenuIcon" title="System Menu"></div>
        <span class="window-title">WinGroove</span>
      </div>
      <div class="title-controls non-draggable">
        <button id="btnHelp" class="win-btn" title="Help">?</button>
        <button id="btnMinimize" class="win-btn" title="Minimize">_</button>
        <button id="btnMaximize" class="win-btn" title="Maximize">□</button>
        <button id="btnClose" class="win-btn win-btn-close" title="Close">✕</button>
      </div>
    </div>

    <!-- Main Player Canvas -->
    <div class="player-body">
      <!-- Left Column: Controls, Display, Transpose, Tempo -->
      <div class="left-section">
        <!-- Top File Bar -->
        <div class="file-cluster">
          <button id="btnFile" class="wg-btn file-btn">File...</button>
          <div class="sunken-box song-combo-box">
            <span id="currentSongTitle" class="current-song-text">No File Loaded</span>
            <button id="btnSongDropdown" class="combo-arrow-btn">▼</button>
          </div>
        </div>

        <!-- Classic LCD / Time & Seek Bar -->
        <div class="display-cluster">
          <div class="sunken-display" id="timeDisplay">
            <span class="lcd-label">TIME</span>
            <span class="lcd-time" id="lblTime">00'00"</span>
            <span class="lcd-total" id="lblTotalTime">/ 00'00"</span>
          </div>
          <div class="seek-bar-wrap">
            <input type="range" id="seekSlider" class="classic-slider seek-slider" min="0" max="1000" value="0" step="1" />
          </div>
        </div>

        <!-- Classic Transport Cluster -->
        <div class="transport-cluster">
          <div class="transport-row">
            <button id="btnPlayPause" class="wg-btn transport-btn" title="Play / Pause">▶ / ❚❚</button>
            <button id="btnRew" class="wg-btn transport-btn" title="Rewind">◀◀</button>
            <button id="btnFF" class="wg-btn transport-btn" title="Fast Forward">▶▶</button>
            <button id="btnRestart" class="wg-btn transport-btn" title="Restart">|◀</button>
            <button id="btnStop" class="wg-btn transport-btn" title="Stop">■</button>
          </div>
          <div class="transport-row-sub">
            <button id="btnPrevTrack" class="wg-btn sub-btn" title="Previous Track">◀ Prev</button>
            <button id="btnNextTrack" class="wg-btn sub-btn" title="Next Track">Next ▶</button>
            <button id="btnRepeat" class="wg-btn sub-btn" title="Toggle Repeat Mode">Rep: Off</button>
          </div>
        </div>

        <!-- Key & Tempo Steppers -->
        <div class="steppers-cluster">
          <div class="stepper-box">
            <span class="stepper-title">KEY</span>
            <div class="sunken-digit-box">
              <span id="lblKey" class="stepper-value">0</span>
            </div>
            <div class="stepper-arrows">
              <button id="btnKeyUp" class="stepper-btn">▲</button>
              <button id="btnKeyDown" class="stepper-btn">▼</button>
            </div>
          </div>

          <div class="stepper-box">
            <span class="stepper-title">TEMPO</span>
            <div class="sunken-digit-box">
              <span id="lblTempo" class="stepper-value">100%</span>
            </div>
            <div class="stepper-arrows">
              <button id="btnTempoUp" class="stepper-btn">▲</button>
              <button id="btnTempoDown" class="stepper-btn">▼</button>
            </div>
          </div>

          <button id="btnResetControls" class="wg-btn reset-btn" title="Reset Key & Tempo">Reset</button>
        </div>

        <!-- Windows & Extras Drawer Buttons -->
        <div class="extra-buttons-cluster">
          <button id="btnOpenInstruments" class="wg-btn feature-btn" title="Open Attached Instruments Window">Instruments...</button>
          <button id="btnSetup" class="wg-btn feature-btn" title="WinGroove Audio Setup">Setup...</button>
          <button id="btnPlaylistToggle" class="wg-btn feature-btn" title="Toggle Playlist">Playlist</button>
        </div>
      </div>

      <!-- Center / Right: Master Stereo Section + 16 Channel Strips -->
      <div class="mixer-section">
        <!-- Master Stereo Section -->
        <div class="master-strip">
          <div class="strip-header">MASTER</div>
          <!-- Stereo Dual 12-segment Level Meter -->
          <div class="master-meters-dual">
            <div class="led-meter-col" id="masterMeterL">
              <!-- 12 led bars (L) -->
            </div>
            <div class="led-meter-col" id="masterMeterR">
              <!-- 12 led bars (R) -->
            </div>
          </div>
          <!-- Master Switch & Fader -->
          <div class="master-controls">
            <div class="switch-wrap">
              <span class="row-label">ON</span>
              <button id="masterOnSwitch" class="wg-led-switch active" title="Master Sound Output"></button>
            </div>
            <div class="fader-wrap">
              <input type="range" id="masterFader" class="classic-vertical-fader" orient="vertical" min="0" max="127" value="100" />
            </div>
          </div>
        </div>

        <!-- 16 MIDI Channels Grid -->
        <div class="channels-container">
          <div class="channels-strip-row" id="channelsRow">
            <!-- 16 strips dynamically or statically rendered -->
          </div>
        </div>

        <!-- Right Side Row Labels matching Classic WinGroove -->
        <div class="mixer-labels-col">
          <div class="label-cell label-level">LEVEL</div>
          <div class="label-cell label-auto">AUTO</div>
          <div class="label-cell label-on">ON</div>
          <div class="label-cell label-fader">FADER</div>
        </div>
      </div>
    </div>

    <!-- Collapsible Playlist Drawer -->
    <div class="playlist-drawer" id="playlistDrawer">
      <div class="drawer-header">
        <span class="drawer-title">Playlist (<span id="queueCount">0</span> tracks)</span>
        <div class="drawer-tools">
          <button id="btnAddFiles" class="wg-btn">Add Files...</button>
          <button id="btnClearQueue" class="wg-btn">Clear</button>
          <button id="btnSaveWav" class="wg-btn">Render WAV...</button>
          <button id="btnClosePlaylist" class="win-btn">✕</button>
        </div>
      </div>
      <div class="queue-list" id="queueList"></div>
    </div>

    <!-- Status Bar -->
    <div class="statusbar">
      <div class="status-cell cell-msg" id="statusMsg">Ready</div>
      <div class="status-cell cell-voices" id="statusVoices">Voices: 0/64</div>
      <div class="status-cell cell-soundfont" id="statusSf" title="SoundFont">WinGroove.sf2</div>
    </div>
  </div>

  <!-- WinGroove Setup Modal -->
  <div class="wg-modal-overlay" id="setupModal">
    <div class="win modal-window">
      <div class="titlebar">
        <span class="window-title">WinGroove Setup</span>
        <button id="btnCloseSetup" class="win-btn win-btn-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="setup-group">
          <span class="group-title">Polyphony & Quality</span>
          <div class="setup-row">
            <label>Max Polyphony:</label>
            <select id="selPolyphony" class="sunken-select">
              <option value="32">32 Voices (Lo-Fi)</option>
              <option value="64" selected>64 Voices (Standard)</option>
              <option value="128">128 Voices (Full)</option>
            </select>
          </div>
        </div>
        <div class="setup-group">
          <span class="group-title">Effects & Leveling</span>
          <div class="setup-row">
            <label>Software Reverb (Echo):</label>
            <input type="range" id="reverbSlider" min="0" max="100" value="35" class="classic-slider" />
            <span id="reverbVal">35%</span>
          </div>
          <div class="setup-row">
            <label>Sound Leveler (Compressor):</label>
            <input type="range" id="levelerSlider" min="0" max="100" value="40" class="classic-slider" />
            <span id="levelerVal">40%</span>
          </div>
        </div>
        <div class="setup-group">
          <span class="group-title">SoundFont Management</span>
          <div class="setup-row">
            <button id="btnChangeSf" class="wg-btn">Load External .sf2...</button>
            <button id="btnOpenSfFolder" class="wg-btn">Open SoundFonts Folder</button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnApplySetup" class="wg-btn">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/midifile.js"></script>
  <script src="js/sf2parser.js"></script>
  <script src="js/synth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
